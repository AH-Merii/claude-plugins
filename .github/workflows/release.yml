name: Release

on:
  push:
    branches: [main]

permissions: {}

# One release run at a time, so two quick merges can't race on the release PR.
concurrency:
  group: release
  cancel-in-progress: false

# release-please reads the Conventional Commit titles merged to main and keeps one
# release PR open that bumps each changed plugin's version in plugin.json and its
# CHANGELOG.md. Merging that PR tags and publishes the releases. Claude Code only
# updates an installed plugin when its version changes, so every change needs a bump.
# Plugins and their baseline are in release-please-config.json.

jobs:
  release-please:
    name: Release PR and tags
    # Granted to this job only; other jobs added later start with none.
    permissions:
      contents: write # push the release branch, tags and GitHub releases
      issues: write # label the release PR (labels go through the issues API)
      pull-requests: write # open and update the release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

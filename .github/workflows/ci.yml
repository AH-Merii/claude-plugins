name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each check job runs one mise task from mise-tasks/check/, so a check runs the same
# way locally (`mise run check:<name>`) and here. Every task checks each plugin in
# turn and names the plugins that fail. To add a check, add a task, a job below and
# one line to ci-ok's `needs:`.

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.6
      - run: mise run check:validate

  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *mise
      - run: mise run check:lint

  types:
    name: Type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *mise
      - run: mise run check:types

  test:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *mise
      - run: mise run check:test

  complexity:
    name: Complexity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *mise
      - run: mise run check:complexity

  # The only check to require on main: it passes only when every check job passed.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - validate
      - lint
      - types
      - test
      - complexity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

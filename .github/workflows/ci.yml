name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run offline unit tests for every plugin
        run: |
          set -o pipefail
          # List plugins up front, NUL-separated, so a listing failure fails the job
          # and names with spaces or glob characters stay intact.
          plugins=$(mktemp)
          find plugins -mindepth 1 -maxdepth 1 -type d -print0 | sort -z > "$plugins"
          status=0
          while IFS= read -r -d '' dir; do
            if [ ! -d "$dir/tests" ]; then
              echo "::notice::$dir has no tests/ directory; skipping."
              continue
            fi
            if [ -z "$(find "$dir/tests" -name 'test*.py' -print -quit)" ]; then
              echo "::notice::$dir/tests has no test*.py files; skipping."
              continue
            fi
            echo "::group::$dir"
            rc=0
            python3 -m unittest discover -s "$dir/tests" || rc=$?
            echo "::endgroup::"
            # unittest exits 5 when it discovers no tests.
            if [ "$rc" -eq 5 ]; then
              echo "::error::$dir/tests has test*.py files but unittest discovered no tests."
              status=1
            elif [ "$rc" -ne 0 ]; then
              status=1
            fi
          done < "$plugins"
          exit "$status"

name: CI

on:
  pull_request:
  # Pushes to main rescan the full history for secrets, and recheck the merged result.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Each check job runs one mise task from mise-tasks/check/, so a check runs the same
# way locally (`mise run check:<name>`) and here. The plugin tasks check each plugin
# in turn and name the plugins that fail. To add a check, add a task, a job below and
# one line to ci-ok's `needs:`.

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.6
      - run: mise run check:validate

  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *mise
      - run: mise run check:lint

  types:
    name: Type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *mise
      - run: mise run check:types

  test:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *mise
      - run: mise run check:test

  complexity:
    name: Complexity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *mise
      - run: mise run check:complexity

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - *mise
      # A PR scans only its own commits; a push to main (no PR base) scans everything.
      - run: mise run check:secrets ${BASE_SHA:+"$BASE_SHA..$HEAD_SHA"}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *mise
      # The token turns on zizmor's online audits; it stays read-only.
      - run: mise run check:workflows
        env:
          GH_TOKEN: ${{ github.token }}

  capabilities:
    name: Plugin capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - *mise
      # No secrets or token on this step: it reads the PR's mods but never runs them.
      # On main the merge base with origin/main is HEAD itself, so nothing is new.
      - run: mise run check:capabilities ${BASE_SHA:+--base "$BASE_SHA"}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # The only check to require on main: it passes only when every check job passed.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - validate
      - lint
      - types
      - test
      - complexity
      - secrets
      - workflows
      - capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
